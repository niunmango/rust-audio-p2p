name: Cross-Platform Desktop Check (Linux, Windows, macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Run workspace tests
        run: cargo test --workspace --exclude rust-audio-android-ffi

      - name: Build TUI & GUI binaries
        run: cargo build --release -p rust-audio-tui -p rust-audio-gui

      - name: Upload desktop binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-audio-${{ matrix.os }}
          path: |
            target/release/rust-audio-tui*
            target/release/rust-audio-gui*
