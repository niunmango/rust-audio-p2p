name: Build Linux Packages & APT Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev dpkg-dev apt-utils fakeroot

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p rust-audio-tui

      - name: Package .deb and .AppImage
        env:
          PKG_VERSION: "0.1.${{ github.run_number }}"
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Run binary self-test
        run: ./target/release/rust-audio-tui --self-test

      - name: Build APT repository metadata for GitHub Pages
        env:
          PKG_VERSION: "0.1.${{ github.run_number }}"
        run: |
          mkdir -p dist/apt-repo
          cp "dist/rust-audio-p2p_${PKG_VERSION}_amd64.deb" dist/apt-repo/
          (
            cd dist/apt-repo
            dpkg-scanpackages --multiversion . > Packages
            gzip -k -f Packages
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="niunmango" \
              -o APT::FTPArchive::Release::Label="rust-audio-p2p" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="./" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Components="main" \
              release . > Release
          )
          cp dist/rust-audio-p2p_latest_amd64.deb dist/apt-repo/
          cp dist/rust-audio-p2p-latest-x86_64.AppImage dist/apt-repo/
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head><meta charset="utf-8"><title>rust-audio-p2p APT Repository</title></head>' \
            '<body>' \
            "  <h1>rust-audio-p2p APT Repository (v${PKG_VERSION})</h1>" \
            '  <p>Install the <code>.deb</code> package once to register this APT repository automatically:</p>' \
            '  <ul>' \
            "    <li><a href=\"rust-audio-p2p_${PKG_VERSION}_amd64.deb\">rust-audio-p2p_${PKG_VERSION}_amd64.deb</a></li>" \
            '    <li><a href="rust-audio-p2p_latest_amd64.deb">rust-audio-p2p_latest_amd64.deb</a></li>' \
            '    <li><a href="rust-audio-p2p-latest-x86_64.AppImage">rust-audio-p2p-latest-x86_64.AppImage</a></li>' \
            '  </ul>' \
            '  <pre>sudo apt update &amp;&amp; sudo apt upgrade</pre>' \
            '</body>' \
            '</html>' > dist/apt-repo/index.html

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.1.${{ github.run_number }}"
          name: "v0.1.${{ github.run_number }}"
          generate_release_notes: true
          files: |
            dist/rust-audio-p2p_*.deb
            dist/rust-audio-p2p-*.AppImage

      - name: Deploy APT repository to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/apt-repo
          keep_files: false
