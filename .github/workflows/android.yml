name: Build Android APK (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK & Platform 35
        run: |
          set +o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "ndk;26.3.11579264" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Rust toolchain & arm64-v8a target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build Rust Android FFI & JNI bridge (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p rust-audio-android-ffi
          NDK_CLANG="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name 'aarch64-linux-android26-clang' | head -n 1)"
          "$NDK_CLANG" -shared -O2 -fPIC android/app/src/main/cpp/jni_bridge.c \
            -L android/app/src/main/jniLibs/arm64-v8a -lrust_audio_android_ffi \
            -Wl,-soname,librust_audio_android_jni.so \
            -o android/app/src/main/jniLibs/arm64-v8a/librust_audio_android_jni.so

      - name: Build Android APK (Debug, installable via sideload)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Stage APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rust-audio-p2p-android.apk
          ls -lh rust-audio-p2p-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-audio-p2p-android-apk
          path: rust-audio-p2p-android.apk
          if-no-files-found: error

      - name: Attach APK to latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          if [[ -n "$TAG" ]]; then
            gh release upload "$TAG" rust-audio-p2p-android.apk --clobber
            echo "Uploaded rust-audio-p2p-android.apk to release $TAG"
          fi
