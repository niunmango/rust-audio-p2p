[package]
name = "rust-audio-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rust-audio-core = { path = "../../crates/core" }
rust-audio-source-local = { path = "../../crates/source-local" }
rust-audio-source-torrent = { path = "../../crates/source-torrent" }
rust-audio-net-friends = { path = "../../crates/net-friends" }
rust-audio-player = { path = "../../crates/player" }
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
